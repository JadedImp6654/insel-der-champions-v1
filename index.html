<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Insel der Champions</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: radial-gradient(circle at 30% 20%, #153a66, #091826 60%);
        width: 100%;
        height: 100%;
        overflow: hidden;
        touch-action: none;
      }
      body {
        display: grid;
        place-items: center;
      }
      #game {
        width: 100vw;
        height: 100vh;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      #game canvas {
        width: 100% !important;
        height: 100% !important;
      }
      #rotate-overlay {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        text-align: center;
        background: rgba(6, 14, 28, 0.94);
        color: #d9f3ff;
        font-family: monospace;
        font-size: 22px;
        z-index: 99999;
        padding: 24px;
      }
      @media (orientation: portrait) {
        #rotate-overlay.mobile-only {
          display: flex;
        }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate-overlay" class="mobile-only">Bitte Gerät ins Querformat drehen<br/>für ein optimales Spielerlebnis.</div>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
